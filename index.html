<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AURA AI</title>
<style>
  :root{ --accent:#52e0ff; --accent-dim:rgba(82,224,255,.22); --bg:#02070d; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:radial-gradient(circle at 50% 40%, #06131d, var(--bg) 70%); color:var(--accent); font-family:ui-monospace,Menlo,Consolas,monospace; }
  #app{ height:100%; display:flex; flex-direction:column; max-width:920px; margin:0 auto; padding:24px; }
  #messages{ flex:1; overflow-y:auto; padding:10px 0 20px; scrollbar-width:thin; scrollbar-color:var(--accent-dim) transparent; }
  .msg{ margin:0 0 16px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .msg .role{ display:block; font-size:10px; letter-spacing:2px; opacity:.6; margin-bottom:4px; }
  .msg.user .role{ color:#8ef; }
  .msg.assistant .role{ color:var(--accent); text-shadow:0 0 8px var(--accent-dim); }
  .bar{ display:flex; gap:10px; padding-top:16px; border-top:1px solid var(--accent-dim); }
  input{ flex:1; background:rgba(2,7,13,.8); border:1px solid var(--accent-dim); color:var(--accent); padding:12px 14px; font:inherit; font-size:14px; outline:none; }
  input:focus{ border-color:var(--accent); box-shadow:0 0 12px var(--accent-dim); }
  button{ background:transparent; border:1px solid var(--accent); color:var(--accent); padding:0 20px; font:inherit; font-size:13px; letter-spacing:1px; cursor:pointer; text-shadow:0 0 8px var(--accent-dim); }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  #status{ font-size:10px; letter-spacing:2px; opacity:.5; padding:8px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="status">AURA // ONLINE</div>
  <div id="messages"></div>
  <div class="bar">
    <input id="input" placeholder="和 AURA 说点什么..." autocomplete="off" />
    <button id="send">发送</button>
  </div>
</div>
<script>
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const history = [];
  let busy = false;

  function addMsg(role, text = '') {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = `<span class="role">${role === 'user' ? 'YOU' : 'AURA'}</span><span class="content"></span>`;
    div.querySelector('.content').textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div.querySelector('.content');
  }

  async function ask(text) {
    if (!text.trim() || busy) return;
    busy = true; sendBtn.disabled = true; statusEl.textContent = 'AURA // THINKING';
    addMsg('user', text);
    history.push({ role: 'user', content: text });
    const contentEl = addMsg('assistant');
    let full = '';

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history.slice(-12) })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        contentEl.textContent = err.error || '请求失败';
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          const t = line.trim();
          if (!t.startsWith('data:')) continue;
          const data = t.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            if (json.delta) {
              full += json.delta;
              contentEl.textContent = full;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            if (json.error) contentEl.textContent += `\n[${json.error}]`;
          } catch {}
        }
      }

      if (full) history.push({ role: 'assistant', content: full });
    } catch (e) {
      contentEl.textContent = '连接中断，请重试。';
    } finally {
      busy = false; sendBtn.disabled = false; statusEl.textContent = 'AURA // ONLINE';
    }
  }

  sendBtn.onclick = () => { const v = input.value; input.value = ''; ask(v); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendBtn.click(); });
</script>
</body>
</html>
